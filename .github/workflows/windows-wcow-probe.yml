name: Probe native Windows containers

on:
  push:
    branches: [research/windows-wcow-0660]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wcow:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Probe Git, device access, mounts and networking
        shell: pwsh
        run: script/probe-windows-containers.ps1
